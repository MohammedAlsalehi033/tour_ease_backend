name: Node.js CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  # -----------------------------------------------
  # Step 1: Build the app on GitHub's machine
  # -----------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Set up the *correct* Node.js version to build with
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm' # This speeds up node_modules caching

      - name: Install dependencies
        run: npm install

      # If you use Prisma, uncomment the following line:
      # - name: Generate Prisma Client
      #   run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Create deployment package
        # We zip up only the files needed to *run* the app
        run: |
          mkdir deployment-package
          cp -R dist deployment-package/dist
          cp -R node_modules deployment-package/node_modules
          cp package.json deployment-package/package.json
          # If you have a .env file, you can't include it here
          # If you have Prisma migrations, add them too:
          # cp -R prisma deployment-package/prisma

      - name: Upload artifact
        # This makes the "deployment-package" available to other jobs
        uses: actions/upload-artifact@v3
        with:
          name: app-build
          path: deployment-package

  # -----------------------------------------------
  # Step 2: Deploy the built code to EC2
  # -----------------------------------------------
  deploy:
    # This job 'needs' the build job to finish first
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        # Get the "deployment-package" we made in the build job
        uses: actions/download-artifact@v3
        with:
          name: app-build

      - name: Zip the package for transfer
        run: zip -r app-build.zip .

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          APP_NAME: "tour-ease-backend"
        run: |
          echo "⚡ Starting deployment to EC2..."
          
          # Setup SSH key
          echo -e "$EC2_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          
          # 1. Copy the ZIP file to the server
          scp -o StrictHostKeyChecking=no -i deploy_key.pem app-build.zip $EC2_USER@$EC2_HOST:~/app-build.zip
          
          # 2. SSH in and run the commands
          ssh -o StrictHostKeyChecking=no -i deploy_key.pem $EC2_USER@$EC2_HOST << 'EOF'
          set -e
          
          echo "� Setting up project directory: ~/tourEaseBackEnd"
          # Create directory if it doesn't exist, and navigate into it
          mkdir -p ~/tourEaseBackEnd
          cd ~/tourEaseBackEnd
          
          echo "� Unzipping new build..."
          # Unzip the new code, overwriting the old files
          unzip -o ~/app-build.zip -d .
          
          # If you use Prisma, uncomment this:
          # echo "Applying database migrations..."
          # npx prisma migrate deploy

          echo "� Reloading PM2 process: $APP_NAME..."
          pm2 reload $APP_NAME --update-env || pm2 start npm --name "$APP_NAME" -- run start
          
          pm2 save
          
          echo "� Cleaning up zip file..."
          rm ~/app-build.zip
          
          echo "✅ Deployment procedure complete!"
          echo "� Current PM2 status:"
          pm2 list
          EOF