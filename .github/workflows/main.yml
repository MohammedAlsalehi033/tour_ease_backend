name: Node.js CI/CD Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          APP_NAME: "tour-ease-backend"
          NODE_ENV: "production"
        run: |
          echo "⚡ Starting deployment to EC2..."
          
          # Setup SSH key
          echo -e "$EC2_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          
          # Deployment commands
          ssh -o StrictHostKeyChecking=no -i deploy_key.pem $EC2_USER@$EC2_HOST << 'EOF'
          set -e
          echo "📂 Navigating to project directory..."
          cd ~/tourEaseBackEnd || { echo "❌ Project directory not found"; exit 1; }
          
          echo "🔄 Syncing with GitHub..."
          gh repo sync --force
          
          echo "📦 Installing dependencies..."
          npm install 
          
          echo "🏗️ Building application..."
          # Continue even if build fails (but log the error)
          if ! npm run build; then
            echo "⚠️ Build complete with errors - proceeding with existing build"
            # You might want to add notification here (Slack/Email)
          fi
          
          echo "🔄 Restarting PM2 process with ID 0..."
          pm2 restart 0 --update-env || {
            echo "❌ Failed to restart PM2 process with ID 0. Starting the application..."
            pm2 start npm --name "$APP_NAME" -- run start
          }
          
          pm2 save
          echo "✅ Deployment procedure complete!"
          echo "📊 Current PM2 status:"
          pm2 list
          EOF